# ---------------------------------------------------------------------------
# Trino Iceberg catalog, pointing at the SAME Nessie REST catalog and MinIO
# bucket that Flink writes to. Mounted at /etc/trino/catalog/iceberg.properties.
# Query it as e.g.  SELECT * FROM iceberg.db.orders;
# ---------------------------------------------------------------------------
connector.name=iceberg

# Use the Iceberg REST catalog protocol and talk to Nessie's REST endpoint.
# Trino supports Nessie only via this REST interface (there is no native
# Nessie connector), which is exactly why we chose the REST catalog for Flink
# too — one catalog, one config style.
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://nessie:19120/iceberg/
iceberg.rest-catalog.warehouse=warehouse

# --- Object storage: MinIO via Trino's native S3 file system ---------------
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
# MinIO requires path-style (bucket-in-path) rather than virtual-host addressing.
s3.path-style-access=true
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin
